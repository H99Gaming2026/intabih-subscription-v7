name: Build Intabih V7

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V7
        run: |
          unzip -q intabih_android_v7_source.zip -d source

      - name: Find Gradle
        run: |
          find source -name gradlew

      - name: Build APK
        run: |
          GRADLE_FILE=$(find source -name gradlew | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Intabih-V7-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
